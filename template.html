:root{
  /* Sampled directly from hypersourced_Photoshop_website.png. The logo file is the
     authority, not the live site: the mark sits at the top of this document, so the
     document's green must be byte-identical to the logo's green or the mismatch shows
     on the same screen. Live site runs #28E375 / #243546, which drifted. */
  --brand-green:#23CE6D;   /* logo green. FILLS ONLY: pills, dots, rules, bars.        */
  --green-deep:#19A455;    /* large green TEXT only. #23CE6D is 2.07:1 on white.       */
  --ink:#204652;           /* logo dark teal. Body, headings. 10.2:1 on white.         */
  --ink-mid:#55707A;
  --ink-soft:#8AA0A7;
  --field:#E4E6E7;         /* page field, matching the live site's grey.               */
  --panel:#FFFFFF;         /* the document sits on white, as it does on hypersourced.com */
  --panel-alt:#F2F5F5;
  --rule:#CFD9DC;
  --rule-soft:#E3EAEC;
  --stop-wash:#EDF1F2;     /* disqualifier rows. Brand is two-colour; see note below.  */
  --rail:96px;
  --measure:720px;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--field);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:19px;
  line-height:1.6;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:calc(var(--measure) + 200px);
  margin:0 auto;background:var(--panel);
  padding:0 40px 72px;
  /* NO BOX-SHADOW HERE. .wrap is the whole document — around 48,000px tall on
     a full packet — and a 40px blur across that forces the compositor to
     rasterise an enormous shadow layer. It froze desktop browsers while staying
     fine on mobile. A hairline border reads the same and costs nothing. */
  border:1px solid var(--rule);
}

/* ---------- reader mode ----------
   The <h1> and <article> exist so extractors keep the whole document instead
   of one section. The h1 is hidden on screen and in print because the banner
   already carries the client and role — but it must stay in the DOM, because
   reader mode uses it as the title and scores the container by it. */
.doc-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap;border:0;padding:0;margin:-1px;}
article.doc{display:block;}

/* ---------- sections: everything flush left ----------
   The old two-column rail put the section number in a gutter and pushed the
   text right, which cost ~100px of measure on every page and left a large
   empty column on paper. The number and the section word now sit ABOVE the
   heading, and every line starts at the same margin. */
.block{display:block;}
.block > .rail{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;}
.block > .flow{min-width:0;}

.numeral{
  font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.16em;
  color:var(--ink-soft);margin:0;
}
.railword{
  font-family:var(--f-display);font-weight:700;
  font-size:15px;line-height:1;letter-spacing:.02em;text-transform:uppercase;
  color:var(--green-deep);margin:0;
}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:2px solid var(--ink);padding:28px 0 16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.mark{width:150px;height:auto;display:block;}
.tagline{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-mid);margin:0 0 3px;
}

/* ---------- status readout ---------- */
/* Three cells: Client, Search, Location. Status is gone -- we were printing a
   state we do not actually track.

   display:table, NOT flex or grid. This document is delivered as a PDF and the
   PDF renderer is wkhtmltopdf, whose engine predates both. Flex space-between
   collapsed and stacked both sides left; grid evaporates entirely. Tables are the
   one two-dimensional layout both the browser and the PDF agree on, so what is
   approved on screen is what the client receives. Do not "modernise" this. */
.status{
  border-bottom:1px solid var(--rule);
  padding:20px 0 22px;
  display:table;width:100%;table-layout:fixed;border-collapse:collapse;
}
.status .cell{display:table-cell;vertical-align:top;width:33.33%;padding:0;}
.status .cell.mid{text-align:center;}
.status .cell.right{text-align:right;}
 /* The masthead used <dl><dt><dd>, which was correct semantics and a rendering
   bug: wkhtmltopdf's parser predates <div> being legal inside <dl>, so it
   reparented the definition elements and the third cell fell to its own row.
   Plain paragraphs inside a real <table> render identically in both engines. */
.stat .k{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 2px;
}
.stat .v{
  font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.018em;
  margin:0;line-height:1.15;
}
/* SCOPED TO screen, DELIBERATELY. wkhtmltopdf lays the page out at roughly 700
   CSS pixels, so a bare (max-width:720px) query fires on every PDF we produce and
   the client has been receiving the phone stylesheet. Scoping to screen keeps the
   narrow layout on narrow screens and leaves the PDF on the desktop layout, which
   is the one that gets approved. Verified: a bare width query fires in
   wkhtmltopdf, "screen and (max-width:720px)" does not. */
@media screen and (max-width:720px){
  /* Narrow screens: three cells side by side would be three cramped columns, so
     each becomes its own full-width row, all flush left. */
  .status,.status .cell,.status .cell.mid,.status .cell.right{
    display:block;width:auto;text-align:left;padding:0 0 12px;}
  .stat .v{font-size:19px;}
}

/* ---------- sections ---------- */
section{padding:44px 0;border-bottom:1px solid var(--rule);}
section:first-of-type{padding-top:40px;}
section:last-of-type{border-bottom:none;}
h2{
  font-family:var(--f-display);
  font-weight:700;
  font-size:clamp(22px,4.4vw,30px);
  line-height:1.12;
  letter-spacing:-.022em;
  margin:0 0 16px;
}
h3{
  font-family:var(--f-display);
  font-weight:700;
  font-size:16px;
  letter-spacing:-.005em;
  margin:28px 0 8px;
}
h4{
  font-family:var(--f-mono);
  font-weight:500;
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-mid);
  margin:24px 0 8px;
}
p{margin:0 0 14px;}
p:last-child{margin-bottom:0;}
.flow > ul{margin:0 0 14px;padding-left:19px;}
.flow > ul li{margin-bottom:7px;}
strong{font-weight:600;}
a{color:var(--green-deep);}

.pull{
  font-family:var(--f-display);
  font-weight:600;
  font-size:19px;
  line-height:1.34;
  letter-spacing:-.015em;
  border-left:3px solid var(--brand-green);
  padding:2px 0 2px 16px;
  margin:22px 0;
  max-width:36ch;
}

/* ---------- fact rows (replaces tables on mobile) ---------- */
.facts{margin:18px 0 0;border-top:1px solid var(--rule);}
/* Currently unused -- the facts() helper is not called by either mode. Left in
   place and converted to a table anyway, so that whoever does call it gets a row
   that survives the PDF instead of rediscovering the grid problem. */
.fact{
  display:table;width:100%;
  padding:11px 0;border-bottom:1px solid var(--rule-soft);
}
.fact > *{display:table-cell;vertical-align:baseline;}
.fact .label{font-weight:600;}
.fact .sub{
  grid-column:1/-1;font-size:14.5px;color:var(--ink-mid);line-height:1.45;margin-top:-2px;
}
.fact .pts{
  font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink);
}
.fact.kill{
  background:var(--stop-wash);margin:0 -14px;padding:11px 14px;
  border-left:3px solid var(--ink);border-bottom-color:var(--rule);
}
.fact.kill .pts{
  color:var(--ink);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
}

.total{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:14px 0 0;margin-top:2px;border-top:2px solid var(--ink);
}
.total .label{font-family:var(--f-display);font-weight:700;font-size:15px;}
.total .pts{font-family:var(--f-mono);font-size:15px;font-weight:500;}

/* ---------- outreach channels ---------- */
.channels{margin:18px 0 6px;border-top:2px solid var(--ink);}
/* Table, not grid. The PDF renderer has no grid; see the note on .cand-top. */
.chn{display:table;width:100%;
  padding:12px 0;border-bottom:1px solid var(--rule-soft);break-inside:avoid;}
.chn > *{display:table-cell;vertical-align:top;}
.chn-n{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;
  letter-spacing:-.01em;width:110px;padding-right:18px;}
.chn-d{font-size:16px;line-height:1.45;color:var(--ink-mid);margin:0;}
@media screen and (max-width:720px){
  .chn,.chn > *{display:block;width:auto;padding-right:0;}
  .chn-n{margin-bottom:2px;}
}

/* ---------- the campaign clock (signature) ---------- */

/* ---------- message samples ---------- */
.msg{
  background:var(--panel-alt);
  border:1px solid var(--rule-soft);
  padding:18px 18px 16px;
  margin:14px 0 0;
}
.msg-head{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:9px;margin-bottom:12px;
}
.msg-head .chan{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-mid);
}
.msg-head .when{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--green-deep);
}
.msg .subj{font-weight:600;margin:0 0 10px;}
.msg .body{font-size:15.5px;line-height:1.58;margin:0;white-space:pre-line;}

/* ---------- price ---------- */

/* THE CLOSING BOX. White card, heavy ink rule, green button with white text.
   The all-green panel was legible but flat -- the button had nowhere to sit and
   ended up white-on-green fighting the panel behind it. A quiet card with one
   saturated control draws the eye to the control, which is the only thing on the
   page we want clicked. */
.callout{
  background:#fff;border:1.5px solid var(--ink);border-top:5px solid var(--brand-green);
  padding:26px 28px 28px;margin:30px 0 0;text-align:center;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.callout h3{margin:0 0 8px;font-size:22px;letter-spacing:-.015em;color:var(--ink);}
.callout p{color:var(--ink-mid);margin:0 auto;max-width:52ch;}
.callout p:last-child{margin-bottom:0;}
.callout a{color:var(--ink);text-decoration:underline;}

.cta{
  display:inline-block;background:var(--brand-green);color:#fff;
  font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;
  padding:15px 34px;border-radius:999px;text-decoration:none;margin-top:18px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.callout a.cta{text-decoration:none;color:#fff;}
.cta:hover{background:var(--green-deep);color:#fff;}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}

/* ---------- slot marker (proposal only) ---------- */
.slot{
  border-bottom:1.5px dotted var(--green-deep);
  background:rgba(35,206,109,.13);
  padding:0 3px;
}


/* ---------- 01 · the funnel (the first thing anyone sees) ---------- */
.bignote{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(25px,5.6vw,34px);line-height:1.08;letter-spacing:-.028em;
  margin:0 0 16px;max-width:16ch;
}



/* ---------- 01 · the breakdown ----------
   Option C, signed off 2026-08-04: one banner number, the Elite band as a hero
   row, and the remaining four bands as a quiet strip. Replaces the five-rung
   funnel. All table-based, so screen and PDF agree. */
/* The figure and its caption sit side by side. Table cells, baseline-aligned, so
   the caption starts on the number's own baseline rather than a line below it. */
.fbanner{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);
  padding:16px 0 14px;margin:24px 0 0;display:table;width:100%;}
.fbanner .fb-n{display:table-cell;vertical-align:bottom;width:1%;white-space:nowrap;
  padding-right:22px;}
.fbanner .fb-t{display:table-cell;vertical-align:bottom;}
.fbanner .big{font-family:var(--f-display);font-weight:800;
  font-size:clamp(42px,8vw,58px);line-height:.86;letter-spacing:-.04em;
  color:var(--ink);margin:0;}
.fbanner .cap{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0;}
.fbanner .sub{font-size:14.5px;color:var(--ink-mid);margin:3px 0 0;}
.ladder{background:rgba(35,206,109,.09);padding:13px 0 12px;margin:14px 0 0;}
/* Full width and fixed layout, so the five bands are spread evenly across the
   same measure as the 957 above them and the Elite figure sits directly under it.
   Arrow columns are narrow and fixed so the gaps stay equal whatever the counts. */
.ladder .rungs{display:table;width:100%;table-layout:fixed;border-collapse:collapse;}
.ladder .c{display:table-cell;vertical-align:middle;text-align:center;padding:0;}
/* Every band is centred in its own equal-width column, including the first and
   the last. Flushing Elite left and Long Shot right made the outer margins match
   but pushed those two away from their columns, so the five numbers were no
   longer evenly spaced across the row. Even columns is the thing that matters. */
.ladder .a{display:table-cell;vertical-align:middle;width:16px;text-align:center;
  color:var(--brand-green);font-family:var(--f-display);font-weight:800;
  font-size:24px;line-height:1;}
.ladder .sn{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;
  color:var(--ink-soft);letter-spacing:-.03em;margin:0;}
.ladder .sl{font-family:var(--f-display);font-weight:700;font-size:14.5px;margin:5px 0 0;}
.ladder .c.lead .sn{color:var(--green-deep);font-size:44px;}
.ladder .c.lead .sl{color:var(--green-deep);font-size:17px;}


/* ---------- the Elite claim ----------
   Appears in section 01 and again in section 02, by instruction. It is the
   highest-value sentence in the packet: it converts a band label into something
   already in motion, and it is literally true, because the outreach is written
   before the packet is sent. Styled to read as a statement rather than body copy.
   Never soften it to "candidates we recommend contacting". */
.claim{
  font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.4;
  border-left:3px solid var(--brand-green);padding:2px 0 2px 16px;
  margin:20px 0 4px;color:var(--ink);
}

/* ---------- 02 · LinkedIn banner ----------
   Replaces the old "N people removed before ranking" callout. Table-cell layout so
   the mark and the copy stay on one line in the PDF. The mark is embedded as a data
   URI: this file is delivered as a standalone PDF and an externally-hosted image
   would simply be absent. */
.li-note{
  display:table;width:100%;background:var(--panel-alt);
  border-left:3px solid var(--ink);
  padding:13px 16px;margin:18px 0 4px;
}
.li-note .li-mark{display:table-cell;vertical-align:middle;width:34px;}
.li-note .li-mark i{width:22px;height:22px;display:block;font-style:normal;}
.li-note .li-copy{display:table-cell;vertical-align:middle;padding-left:12px;
  font-size:15.5px;line-height:1.45;color:var(--ink);}

/* Role match is the second pillar and gets its own page: it was landing at
   the foot of the Company match page with its tier scale pushed overleaf,
   which read as a footnote to the first pillar rather than an equal one. */
.dim.newpage{break-before:page;}

/* ---------- 03 · the points scale ---------- */
/* ---------- 03 · the two big signals ----------
   Restructured so each dimension reads as its own block at a glance: a green
   heading with the ceiling beneath it, then rows where the points and the
   headcount sit on ONE line at the same size. The old version put "PTS" in a
   right-aligned column half a page away from the number it labelled. */
.dim{margin:22px 0 0;}
.dim-h{
  font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;
  color:var(--grn-d,var(--green-deep));margin:0;line-height:1.1;
}
.dim-sub{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin:3px 0 0;
}
.scale{margin:12px 0 4px;border-top:1.5px solid var(--ink);}
.step{padding:8px 0;border-bottom:1px solid var(--rule-soft);}
.step-line{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;
  margin:0 0 1px;
}
.step-pts{color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.step-line.t1 .step-pts{color:var(--green-deep);}   /* the top band */
.step-line.t2 .step-pts{color:var(--ink-mid);}      /* the one below it */
.step-count{color:var(--ink);font-weight:600;}
.step-sep{color:var(--rule);font-weight:400;}
.step-what{font-size:15px;line-height:1.4;color:var(--ink-mid);margin:0;}
.aside{
  font-size:15px;color:var(--ink-mid);border-left:2px solid var(--rule);
  padding-left:14px;margin:16px 0 0;
}

/* ---------- 03 · secondary signals ---------- */
.signals{margin:16px 0 0;border-top:1px solid var(--rule);}
/* The bonus signals carry the same visual weight as the claim banner: a green
   rule on the left and no hairline separators. They were reading as a quiet table
   when they are the part that explains why rank 8 is not rank 30. */
.sig{
  display:table;width:100%;
  border-left:3px solid var(--brand-green);
  padding:9px 0 9px 14px;margin:0 0 8px;
  background:var(--panel-alt);
}
.sig > *{display:table-cell;vertical-align:top;}
.sig-pts{width:46px;padding-right:12px;text-align:right;
  font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--green-deep);}
.sig-b{min-width:0;}
.sig-n{font-family:var(--f-display);font-weight:700;font-size:15.5px;margin:0 0 2px;
  letter-spacing:-.01em;color:var(--ink);}
.sig-who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin-left:9px;}
.sig-w{font-size:14.5px;color:var(--ink-mid);line-height:1.42;margin:0;}

/* ---------- 06 · the compact list ---------- */
.list{margin:16px 0 0;border-top:2px solid var(--ink);}
.row{
  display:table;width:100%;
  padding:11px 0;border-bottom:1px solid var(--rule-soft);
}
.row > *{display:table-cell;vertical-align:top;}
.row-s{width:1%;white-space:nowrap;padding-left:12px;}
.row-n{
  font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink-soft);
  padding-top:4px;width:30px;padding-right:12px;
}
.row-b{min-width:0;}
.row-name{font-family:var(--f-display);font-weight:700;font-size:15.5px;margin:0;letter-spacing:-.01em;}
.row-name a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--brand-green);}
.in02{
  font-family:var(--f-mono);font-weight:400;font-size:8.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--green-deep);margin-left:8px;white-space:nowrap;
}
.row-role{font-size:14px;color:var(--ink-mid);margin:1px 0 2px;line-height:1.3;}
.row-why{font-size:14px;line-height:1.42;color:var(--ink);margin:0;}
.row-s{
  font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em;padding-top:2px;
}

/* ---------- candidate roster (section 02) ---------- */
.roster{margin:14px 0 0;border-top:2px solid var(--ink);}
.cand{padding:18px 0 17px;border-bottom:1px solid var(--rule-soft);break-inside:avoid;}
/* Name flush left, rank on the far right as a green disc.

   display:table, NOT grid. A right-aligned cell inside a grid is exactly the
   construction that broke the funnel: wkhtmltopdf drops grid, the row becomes a
   stack of blocks, and anything right-aligned flies to the page margin on its own
   line. Tables survive both renderers. */
.cand-top{display:table;width:100%;}
.cand-id{display:table-cell;vertical-align:top;min-width:0;}
.cand-rank{
  display:table-cell;vertical-align:top;width:38px;text-align:right;
  padding-left:14px;white-space:nowrap;
}
/* LinkedIn button, immediately left of the rank disc. The name is a link too,
   but a name that happens to be underlined does not read as "click me" the way a
   recognisable mark does. Sized to sit on the disc's optical centre line.
   Rendered only when the row actually has a URL -- see render_featured. */


/* The disc. Fixed 30px so a two-digit rank has room without the digits touching
   the edge; line-height equals the height so the numeral sits optically centred.
   Filled with brand green because this is a fill, not text -- see the note on
   --brand-green at the top of this file. */
.cand-rank i{
  display:inline-block;width:30px;height:30px;line-height:30px;
  border-radius:50%;background:var(--brand-green);color:#fff;
  font-family:var(--f-display);font-style:normal;font-weight:800;font-size:14px;
  text-align:center;letter-spacing:-.02em;
}
.cand-id{min-width:0;}
.cand-name{
  font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.012em;
  margin:0 0 1px;line-height:1.25;
}
.cand-name a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--brand-green);}
.cand-name a:hover{color:var(--green-deep);}
.cand-role{font-size:15px;color:var(--ink-mid);line-height:1.35;margin:0 0 2px;}
.cand-meta{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-soft);margin:0;
}
.cand-reloc{
  display:inline-block;margin-left:8px;padding:1px 6px;
  background:var(--panel-alt);color:var(--ink-mid);border-radius:3px;
}
/* Score rides on the name line after a hyphen rather than in its own column.
   A right-aligned number sat far from the name it belonged to and the eye had
   to travel; this reads as one object. */
.cand-score{
  font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.012em;
  color:var(--green-deep);white-space:nowrap;
}
/* Short hyphen, ink-black, matching the name. An em dash rendered oddly at this
   weight and pulled the eye away from the number it was joining. */
.cand-dash{color:var(--ink);font-weight:700;}
.cand-bullets{margin:9px 0 0;padding:0;list-style:none;}
.cand-bullets li{
  font-size:16px;line-height:1.45;color:var(--ink);margin:0 0 3px;padding-left:15px;
  position:relative;
}
.cand-bullets li::before{
  content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--brand-green);
}
.cand-fit{font-size:16px;line-height:1.55;margin:18px 0 0;color:var(--ink);}

/* Repeats on every printed sheet. See the note in build_packet where it is
   injected. Screen hides it -- the document already ends with the footer there. */
.pagemark{display:none;}

footer{
  padding:34px 0 0;text-align:center;
  font-family:var(--f-mono);font-size:10.5px;line-height:1.7;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);
  border-top:2px solid var(--ink);margin-top:44px;
}

/* ---------- mobile ---------- */
@media screen and (max-width:720px){
  body{font-size:16.5px;}
  .wrap{padding:0 18px 60px;}
  .block{grid-template-columns:1fr;gap:0;}
  .block > .rail{grid-column:1;margin-bottom:16px;}
  .railword{font-size:22px;}
  .block > .flow{grid-column:1;}
        .fact{grid-template-columns:minmax(0,1fr);}
  .cand-top{grid-template-columns:26px minmax(0,1fr);gap:0 9px;}
  .cand-bullets{margin-left:0;}
  .cand-name{font-size:16px;}
  .cand-role{font-size:14.5px;}
  .cand-score{font-size:18px;}
  .cand-fit{margin-left:0;margin-top:11px;font-size:15px;}
      .step{grid-template-columns:52px minmax(0,1fr);gap:0 12px;}
  .sig-pts{width:40px;padding-right:9px;}
  .row{grid-template-columns:26px minmax(0,1fr) auto;gap:0 9px;}
  .row-name{font-size:15px;}
  .in02{display:none;}
  .fact .pts{grid-row:1;justify-self:start;order:-1;color:var(--ink-soft);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
}

/* ---------- desktop clock becomes horizontal ---------- */
@media (min-width:721px){
                  }

/* ---------- print ---------- */

/* ══════════════════════════════════════════════════════════════════════════
   PRINT
   One source, two outputs. The PDF is this file printed, not a second
   document, so the two can never drift.

   THE RULE THAT MATTERS MOST: never use clamp() with vw units here. Viewport
   units do not resolve against a paper page — they collapse to the minimum,
   which silently shrinks every display number to body size. Every clamped
   size on screen gets an explicit pt override below.
   ══════════════════════════════════════════════════════════════════════════ */
@media print{
  @page{size:letter;margin:14mm 13mm 22mm;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{background:#fff;font-size:11pt;line-height:1.48;padding:0;}
  /* NO FRAME ON PAPER. .wrap carries a hairline border on screen because it is
     the page edge -- it stands in for the box-shadow that used to freeze desktop
     browsers. On paper the sheet already has an edge, so that border prints as a
     rectangle drawn around the content of every page and reads as a stray frame.
     Screen keeps it, print drops it. */
  .wrap{max-width:none;padding:0;box-shadow:none;background:#fff;border:0;}

  /* No rail. Section number and word sit above the heading, everything flush
     left, which recovers about 100px of measure on every page. */
  .block{display:block;}
  .block > .rail{display:block;margin:0 0 1pt;}
  .block > .rail .numeral{display:inline;font-size:7.5pt;margin-right:7pt;}
  .block > .rail .railword{display:inline;font-size:9pt;letter-spacing:.14em;}
  .block > .flow{margin-left:0;}

  .mark{width:30mm;}
  .tagline{font-size:7pt;}
  .numeral{font-size:7pt;}


  /* every clamped size, restated in points */
  h2{font-size:16pt;line-height:1.12;margin-bottom:6pt;}
  h3{font-size:11.5pt;margin:11pt 0 3pt;}
  h4{font-size:7.5pt;margin:10pt 0 3pt;}
  /* One line, always. The old 22ch measure wrapped it in two, which made the
     opening statement read as a paragraph instead of a headline. */
  .bignote{font-size:16.5pt;line-height:1.15;max-width:none;white-space:nowrap;
           margin-bottom:8pt;}
  .claim{font-size:12pt;line-height:1.35;padding-left:11pt;margin:14pt 0 3pt;}
  /* Section 01's two display numbers use clamp() on screen. Viewport units do not
     resolve on paper -- see the note at the top of this print block -- so both are
     restated in points here. Miss this and the 957 renders at body size. */
  .fbanner .big{font-size:36pt;line-height:.86;}
  .hero .hn{font-size:32pt;width:96pt;}
  .strip .c .sn{font-size:18pt;}
    .pull{font-size:13pt;line-height:1.3;}
  .step-pts{font-size:14pt;}
  .cand-name{font-size:12pt;margin-bottom:0;}
  .cand-score{font-size:13pt;}
  .cand-role{font-size:9.4pt;margin-bottom:1px;}
  .cand-fit{font-size:9.6pt;line-height:1.38;}

  .cand-bullets li{font-size:9.8pt;line-height:1.36;margin-bottom:1.5pt;}
  .cand-score{font-size:12pt;}
  .chn-n{font-size:11pt;} .chn-d{font-size:9.6pt;}
  /* Flexbox is unreliable in PDF engines — space-between silently collapses
     and both sides stack left. Table layout is honoured everywhere. */
  .status{display:table;width:100%;table-layout:fixed;padding:10pt 0 12pt;}
  .status .cell{display:table-cell;vertical-align:top;width:33.33%;}
  .status .cell.mid{text-align:center;}
  .status .cell.right{text-align:right;}
  .stat{margin-bottom:7pt;}
  /* 16pt was tuned when wkhtmltopdf was silently printing everything at 78%.
     At true scale three 33% columns cannot hold a long role title and a
     city-plus-arrangement on one line each, so both wrapped. 12.5pt fits the
     longest real values with room to spare. */
  .stat .v{font-size:12.5pt;line-height:1.15;}
  /* The masthead labels and the section rail word are the same kind of
     element -- small uppercase mono -- so they carry the same size. */
  .stat .k{font-size:9pt;letter-spacing:.14em;margin-bottom:2pt;}
  .row-name{font-size:10.5pt;}
  .row-s{font-size:11pt;}
  .row-role,.row-why{font-size:8.8pt;line-height:1.32;}
  .sig-n{font-size:10pt;}
  .sig-w,.step-what{font-size:9pt;line-height:1.35;}
    .msg .body{font-size:9.4pt;line-height:1.45;}

  /* pagination */
  section{break-inside:auto;padding:12pt 0;}
  section.pagebreak{break-before:page;}
  h2,h3,h4{break-after:avoid;}
  p,li{orphans:2;widows:2;}
  /* Keep only SHORT, atomic things unbreakable. A candidate card is ten lines,
     and forcing it whole leaves half-empty pages on strict engines — worse than
     a card that splits. Let the long lists flow. */
  /* A candidate is never split across a page. Three bullets plus a paragraph
     is short enough to always fit, so this no longer costs half-empty pages
     the way it did when the card carried a full column layout. */
  .cand{break-inside:avoid;break-after:auto;}
    .dim{break-inside:avoid;break-after:avoid;margin-top:14pt;}
  .dim-h{font-size:15pt;} .dim-sub{font-size:7.5pt;}
  .step{padding:4.5pt 0;}
  .step-line{font-size:11pt;gap:7pt;margin-bottom:0;}
  .step-what{font-size:9.4pt;line-height:1.32;}
  /* Company match and role match together on one page, tiebreakers on the next. */
  .pagebreak-here{break-before:page;display:block;height:0;}
  .cand-bullets{margin:5pt 0 0;}
  .cand-fit{margin:9pt 0 0;}
  .funnel,.scale,.signals,.list,.roster{break-inside:auto;}

  /* fills and links */
  a{color:var(--ink);text-decoration:none;}
  .cta{border:0;background:var(--brand-green);color:#fff;padding:9pt 22pt;font-size:11pt;}
  .msg{background:#F7F9F9;border:0.6pt solid var(--rule);}
  /* The page mark, centred on the foot of every sheet. The @page bottom margin
     is what keeps body text off it. */
  /* Fixed positioning is relative to the CONTENT box, so a positive offset parks
     the mark 22mm of margin above the paper edge. A negative offset pushes it down
     into that margin, which is where a footer belongs. */
  .pagemark{display:block;position:fixed;left:0;right:0;bottom:-16mm;height:12mm;
    background-repeat:no-repeat;background-position:center center;
    background-size:auto 11mm;opacity:.95;}
  /* Every section starts on its own sheet, so a packet has the same shape whoever
     the client is and however long the prose runs. 01 and 02 deliberately share
     sheet one; the candidate roster breaks to its own page from inside 02. */
  section.block{break-before:page;}
  section.block:first-of-type,section.block:nth-of-type(2){break-before:auto;}
  .cand{break-inside:avoid;page-break-inside:avoid;}
  .in02{display:none;}

  /* A medium must never be cut in half across a page, and the four of them read
     as one comparison, so the group is kept whole as well. With four channels
     this always fits; if the list ever grows past a page, the group rule is what
     will fail loudly rather than silently splitting Phone down the middle. */
  .dim.newpage{break-before:page;page-break-before:always;}
  .channels{break-inside:avoid;}
  /* A sample message is a single artefact -- half a voicemail script across
     a page turn is unreadable and looks like a rendering fault. */
  .msg,.samples .msg{break-inside:avoid;page-break-inside:avoid;}
  .chn{break-inside:avoid;}
  .chn-n{width:76pt;padding-right:12pt;}
}
</style>
</head>
